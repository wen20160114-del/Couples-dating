<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的專屬口袋地圖</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff758c">
    <!-- Firebase App (核心) 與 Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --shadow: 0 10px 25px rgba(255, 117, 140, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
            color-scheme: light;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
            min-height: 550px;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }

        .page.active {
            display: flex;
        }

        h2, h3 {
            text-align: center;
            color: #ff5277;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .status-badge {
            background: #e1f5fe;
            color: #0288d1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #666;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            background: #fff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-nav {
            background: #f1f3f5;
            color: #495057;
            margin-top: 8px;
        }

        .btn-category {
            background: #fff0f3;
            color: #ff5277;
            border: 2px solid #ff758c;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* 列表與群組樣式 */
        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 360px;
            padding-right: 4px;
        }

        .city-header {
            font-size: 1.05rem;
            color: #e65100;
            margin: 14px 0 6px 8px;
            font-weight: 600;
        }

        .region-header {
            font-size: 0.95rem;
            color: #0288d1;
            margin: 8px 0 4px 16px;
            font-weight: 600;
        }

        .place-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            margin-left: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }

        .place-card:hover {
            transform: translateY(-2px);
        }

        .place-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .place-memo {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-actions button {
            margin-top: 0;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .empty-state {
            text-align: center;
            color: #aaa;
            margin-top: 50px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 狀態提示 -->
        <div id="connection-status" class="status-badge">🔄 正在連線至雲端資料庫...</div>

        <!-- 頁面 1：新增表單頁 -->
        <div id="page-1" class="page active">
            <h2>📍 想去一起的地方</h2>
            <div class="form-group">
                <label>名稱：</label>
                <input type="text" id="place-name" placeholder="例如：屋馬燒肉">
            </div>
            
            <!-- 大標：分類 -->
            <div class="form-group">
                <label>分類：</label>
                <select id="place-category">
                    <option value="主食">主食</option>
                    <option value="點心">點心</option>
                    <option value="飲料">飲料</option>
                    <option value="景點">景點</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            
            <!-- 次標：縣市 -->
            <div class="form-group">
                <label>縣市：</label>
                <select id="place-city" onchange="updateDistricts()">
                    <option value="臺中市">臺中市</option>
                    <option value="臺北市">臺北市</option>
                    <option value="新北市">新北市</option>
                    <option value="桃園市">桃園市</option>
                    <option value="臺南市">臺南市</option>
                    <option value="高雄市">高雄市</option>
                    <option value="基隆市">基隆市</option>
                    <option value="新竹市">新竹市</option>
                    <option value="嘉義市">嘉義市</option>
                    <option value="苗栗縣">苗栗縣</option>
                    <option value="彰化縣">彰化縣</option>
                    <option value="南投縣">南投縣</option>
                    <option value="宜蘭縣">宜蘭縣</option>
                    <option value="花蓮縣">花蓮縣</option>
                    <option value="臺東縣">臺東縣</option>
                    <option value="屏東縣">屏東縣</option>
                    <option value="澎湖縣">澎湖縣</option>
                    <option value="金門縣">金門縣</option>
                    <option value="連江縣">連江縣</option>
                </select>
            </div>

            <!-- 小標：區域 -->
            <div class="form-group">
                <label>區域 ：</label>
                <select id="place-region">
                    <!-- 動態載入 -->
                </select>
            </div>

            <div class="form-group">
                <label>備註 (其他補充)：</label>
                <input type="text" id="place-memo" placeholder="例如：必吃花生豆花、停車方便">
            </div>
            <button class="btn-primary" onclick="addPlace()">✨ 新增記錄到雲端</button>
            <button class="btn-nav" onclick="openMenu(false)">📌 查看我們的口袋名單 (想去)</button>
            <button class="btn-nav" onclick="openMenu(true)">🏆 查看已去過 / 已完成清單</button>
        </div>

        <!-- 頁面 2：分類選單頁 -->
        <div id="page-2" class="page">
            <h2 id="menu-title">📌 選擇分類</h2>
            <button class="btn-category" onclick="selectCategory('主食')">🍜 主食</button>
            <button class="btn-category" onclick="selectCategory('點心')">🧁 點心</button>
            <button class="btn-category" onclick="selectCategory('飲料')">🧋 飲料</button>
            <button class="btn-category" onclick="selectCategory('景點')">🌿 景點</button>
            <button class="btn-category" onclick="selectCategory('其他')">⭐ 其他</button>
            <button class="btn-nav" style="margin-top: 20px;" onclick="switchPage(1)">⬅️ 返回新增頁面</button>
        </div>

        <!-- 頁面 3：內容列表頁 -->
        <div id="page-3" class="page">
            <h2 id="list-page-title">📌 詳細清單</h2>
            <div id="list-container" class="list-container">
                <div class="empty-state">載入中...</div>
            </div>
            <button class="btn-nav" style="margin-top: 15px;" onclick="switchPage(2)">⬅️ 返回上一頁 (分類選單)</button>
            <button class="btn-primary" style="margin-top: 8px;" onclick="switchPage(1)">🏠 返回主頁</button>
        </div>
    </div>

            "金門縣": ["金城鎮", "金湖鎮", "金沙鎮", "金寧鄉", "烈嶼鄉", "烏坵鄉"],

        function updateDistricts() {
            const citySelect = document.getElementById('place-city');
            const regionSelect = document.getElementById('place-region');
            const selectedCity = citySelect.value;
            
            regionSelect.innerHTML = '';
            const districts = districtData[selectedCity] || ["其他"];
            
            districts.forEach(district => {
                const option = document.createElement('option');
                option.value = district;
                option.textContent = district;
                regionSelect.appendChild(option);
            });
        }

        window.onload = function() {
            updateDistricts();
        };

        // Firebase 專案設定
        const firebaseConfig = {
            apiKey: "AIzaSyAom-u5FTFI8B8ZWICdZ0YxqY2CuJ5eNFg",
            authDomain: "couples-dating-50cb0.firebaseapp.com",
            projectId: "couples-dating-50cb0",
            storageBucket: "couples-dating-50cb0.firebasestorage.app",
            messagingSenderId: "361607229257",
            appId: "1:361607229257:web:5f8a740525dad3c62bb498"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("dating_places").limit(1).get()
            .then(() => {
                document.getElementById("connection-status").innerHTML = "🟢 已成功連線至雲端資料庫 (雙向同步中)";
            })
            .catch((error) => {
                document.getElementById("connection-status").innerHTML = "🔴 連線失敗，請檢查設定";
                console.error("Firebase connection error: ", error);
            });

        let currentIsCompleted = false;
        let currentCategory = '';

        function switchPage(pageNum) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageNum}`).classList.add('active');
        }

        function openMenu(isCompleted) {
            currentIsCompleted = isCompleted;
            document.getElementById('menu-title').textContent = isCompleted ? "🏆 已完成清單 - 選擇分類" : "📌 口袋名單 - 選擇分類";
            switchPage(2);
        }

        function selectCategory(categoryName) {
            currentCategory = categoryName;
            document.getElementById('list-page-title').textContent = `${currentIsCompleted ? '🏆' : '📌'} ${categoryName}`;
            switchPage(3);
            loadFilteredPlaces();
        }

        function addPlace() {
            const name = document.getElementById('place-name').value.trim();
            const category = document.getElementById('place-category').value;
            const city = document.getElementById('place-city').value;
            const region = document.getElementById('place-region').value;
            const memo = document.getElementById('place-memo').value.trim();

            if (!name) {
                alert('請填寫地點名稱！');
                return;
            }

            db.collection("dating_places").add({
                name: name,
                category: category,
                city: city,
                region: region,
                memo: memo,
                completed: false,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert('✨ 成功新增到雲端口袋名單！');
                document.getElementById('place-name').value = '';
                document.getElementById('place-memo').value = '';
                openMenu(false);
                selectCategory(category);
            })
            .catch((error) => {
                alert('新增失敗：' + error.message);
            });
        }

        function loadFilteredPlaces() {
            const container = document.getElementById('list-container');
            container.innerHTML = '<div class="empty-state">載入中...</div>';

            db.collection("dating_places")
                .where("completed", "==", currentIsCompleted)
                .where("category", "==", currentCategory)
                .get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) {
                        container.innerHTML = '<div class="empty-state">這裡目前沒有這個分類的資料喔！</div>';
                        return;
                    }

                    const groups = {};
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        data.id = doc.id;
                        const city = data.city || '臺中市';
                        const reg = data.region || '其他區域';
                        
                        if (!groups[city]) groups[city] = {};
                        if (!groups[city][reg]) groups[city][reg] = [];
                        
                        groups[city][reg].push(data);
                    });

                    container.innerHTML = '';

                    for (const [cityName, regions] of Object.entries(groups)) {
                        const cityHeader = document.createElement('div');
                        cityHeader.className = 'city-header';
                        cityHeader.innerHTML = `🏙️ ${cityName}`;
                        container.appendChild(cityHeader);

                        for (const [regionName, items] of Object.entries(regions)) {
                            const regHeader = document.createElement('div');
                            regHeader.className = 'region-header';
                            regHeader.innerHTML = `📍 ${regionName}`;
                            container.appendChild(regHeader);

                            items.forEach(item => {
                                const card = document.createElement('div');
                                card.className = 'place-card';
                                
                                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + item.city + item.region + ' ' + (item.memo || ''))}`;
                                
                                let actionButtons = '';
                                if (!currentIsCompleted) {
                                    actionButtons = `
                                        <button class="btn-primary" onclick="window.open('${mapsUrl}', '_blank')">🗺️ Google 地圖</button>
                                        <button class="btn-success" onclick="toggleStatus('${item.id}', true)">✔️ 標記已去過</button>
                                        <button class="btn-danger" onclick="deletePlace('${item.id}')">🗑️ 刪除</button>
                                    `;
                                } else {
                                    actionButtons = `
                                        <button class="btn-primary" onclick="window.open('${mapsUrl}', '_blank')">🗺️ Google 地圖</button>
                                        <button class="btn-nav" onclick="toggleStatus('${item.id}', false)">↩️ 移回想去</button>
                                        <button class="btn-danger" onclick="deletePlace('${item.id}')">🗑️ 刪除</button>
                                    `;
                                }

                                card.innerHTML = `
                                    <div class="place-title">${item.name}</div>
                                    <div class="place-memo">📝 備註：${item.memo || '無'}</div>
                                    <div class="card-actions">
                                        ${actionButtons}
                                    </div>
                                `;
                                container.appendChild(card);
                            });
                        }
                    }
                })
                .catch((error) => {
                    container.innerHTML = '<div class="empty-state">載入資料發生錯誤</div>';
                    console.error("Error getting documents: ", error);
                });
        }

        function toggleStatus(id, newStatus) {
            db.collection("dating_places").doc(id).update({
                completed: newStatus
            })
            .then(() => {
                loadFilteredPlaces();
            })
            .catch((error) => {
                alert('更新狀態失敗：' + error.message);
            });
        }

        function deletePlace(id) {
            if (confirm('確定要刪除這個地點嗎？')) {
                db.collection("dating_places").doc(id).delete()
                    .then(() => {
                        loadFilteredPlaces();
                    })
                    .catch((error) => {
                        alert('刪除失敗：' + error.message);
                    });
            }
        }
    </script>
</body>
</html>
