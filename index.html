<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的專屬口袋地圖</title>
    <!-- Firebase App (核心) 與 Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff758c">
    <style>
        :root {
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --shadow: 0 10px 25px rgba(255, 117, 140, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
            min-height: 550px;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }

        .page.active {
            display: flex;
        }

        h2, h3 {
            text-align: center;
            color: #ff5277;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .status-badge {
            background: #e1f5fe;
            color: #0288d1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #666;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            background: #fff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-nav {
            background: #f1f3f5;
            color: #495057;
            margin-top: 8px;
        }

        /* 列表與分類群組樣式 */
        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 420px;
            padding-right: 4px;
        }

        .category-header {
            font-size: 1.1rem;
            color: #ff5277;
            margin: 16px 0 8px 4px;
            padding-bottom: 4px;
            border-bottom: 2px solid #ffe6eb;
            font-weight: 700;
        }

        .place-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }

        .place-card:hover {
            transform: translateY(-2px);
        }

        .place-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .place-memo {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-actions button {
            margin-top: 0;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .empty-state {
            text-align: center;
            color: #aaa;
            margin-top: 50px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 狀態提示 -->
        <div id="connection-status" class="status-badge">🔄 正在連線至雲端資料庫...</div>

        <!-- 頁面 1：新增表單頁 -->
        <div id="page-1" class="page active">
            <h2>📍 想去一起的地方</h2>
            <div class="form-group">
                <label>名稱：</label>
                <input type="text" id="place-name" placeholder="例如：屋馬燒肉">
            </div>
            <div class="form-group">
                <label>分類：</label>
                <select id="place-category">
                    <option value="主食">主食</option>
                    <option value="點心">點心</option>
                    <option value="飲料">飲料</option>
                    <option value="風景">風景</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>備註 (建議包含地區，例如：南屯區)：</label>
                <input type="text" id="place-memo" placeholder="例如：南屯區、必吃花生豆花">
            </div>
            <button class="btn-primary" onclick="addPlace()">✨ 新增記錄到雲端</button>
            <button class="btn-nav" onclick="switchPage(2)">📌 查看我們的口袋名單 (想去)</button>
            <button class="btn-nav" onclick="switchPage(3)">🏆 查看已去過 / 已完成清單</button>
        </div>

        <!-- 頁面 2：想去清單頁 (依分類群組) -->
        <div id="page-2" class="page">
            <h2>📌 我們的口袋名單 (想去)</h2>
            <div id="wishlist-container" class="list-container">
                <div class="empty-state">載入中...</div>
            </div>
            <button class="btn-nav" onclick="switchPage(1)">⬅️ 返回新增頁面</button>
        </div>

        <!-- 頁面 3：已完成清單頁 (依分類群組) -->
        <div id="page-3" class="page">
            <h2>🏆 已去過 / 已完成清單</h2>
            <div id="completed-container" class="list-container">
                <div class="empty-state">載入中...</div>
            </div>
            <button class="btn-nav" onclick="switchPage(1)">⬅️ 返回新增頁面</button>
        </div>
    </div>

    <script>
        // ==================== Firebase 專案設定 ====================
        const firebaseConfig = {
            apiKey: "AIzaSyAom-u5FTFI8B8ZWICdZ0YxqY2CuJ5eNFg",
            authDomain: "couples-dating-50cb0.firebaseapp.com",
            projectId: "couples-dating-50cb0",
            storageBucket: "couples-dating-50cb0.firebasestorage.app",
            messagingSenderId: "361607229257",
            appId: "1:361607229257:web:5f8a740525dad3c62bb498"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 檢查連線狀態
        db.collection("dating_places").limit(1).get()
            .then(() => {
                document.getElementById("connection-status").innerHTML = "🟢 已成功連線至雲端資料庫 (雙向同步中)";
            })
            .catch((error) => {
                document.getElementById("connection-status").innerHTML = "🔴 連線失敗，請檢查設定";
                console.error("Firebase connection error: ", error);
            });

        // 頁面切換函式
        function switchPage(pageNum) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageNum}`).classList.add('active');
            
            if (pageNum === 2) {
                loadPlaces(false); // 載入想去清單
            } else if (pageNum === 3) {
                loadPlaces(true);  // 載入已完成清單
            }
        }

        // 新增地點到 Firestore
        function addPlace() {
            const name = document.getElementById('place-name').value.trim();
            const category = document.getElementById('place-category').value;
            const memo = document.getElementById('place-memo').value.trim();

            if (!name) {
                alert('請填寫地點名稱！');
                return;
            }

            db.collection("dating_places").add({
                name: name,
                category: category,
                memo: memo,
                completed: false,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert('✨ 成功新增到雲端口袋名單！');
                document.getElementById('place-name').value = '';
                document.getElementById('place-memo').value = '';
                switchPage(2); // 新增後直接跳轉到想去清單
            })
            .catch((error) => {
                alert('新增失敗：' + error.message);
            });
        }

        // 載入並依「分類」群組顯示資料
        function loadPlaces(isCompleted) {
            const containerId = isCompleted ? 'completed-container' : 'wishlist-container';
            const container = document.getElementById(containerId);
            container.innerHTML = '<div class="empty-state">載入中...</div>';

            db.collection("dating_places")
                .where("completed", "==", isCompleted)
                .get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) {
                        container.innerHTML = '<div class="empty-state">這裡目前沒有資料喔！</div>';
                        return;
                    }

                    // 1. 收集資料並依照分類進行分組 (Group by category)
                    const groups = {};
                    querySnapshot.forEach((doc) => {
                        const data = doc.item = doc.data();
                        data.id = doc.id;
                        const cat = data.category || '未分類';
                        
                        if (!groups[cat]) {
                            groups[cat] = [];
                        }
                        groups[cat].push(data);
                    });

                    container.innerHTML = '';

                    // 2. 依照分類大標與內容渲染到畫面上
                    for (const [categoryName, items] of Object.entries(groups)) {
                        // 建立分類大標
                        const header = document.createElement('div');
                        header.className = 'category-header';
                        header.innerHTML = `📌 ${categoryName}`;
                        container.appendChild(header);

                        // 建立該分類下的所有卡片
                        items.forEach(item => {
                            const card = document.createElement('div');
                            card.className = 'place-card';
                            
                            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + (item.memo || ''))}`;
                            
                            let actionButtons = '';
                            if (!isCompleted) {
                                actionButtons = `
                                    <button class="btn-primary" onclick="window.open('${mapsUrl}', '_blank')">🗺️ Google 地圖</button>
                                    <button class="btn-success" onclick="toggleStatus('${item.id}', true)">✔️ 標記已去過</button>
                                    <button class="btn-danger" onclick="deletePlace('${item.id}')">🗑️ 刪除</button>
                                `;
                            } else {
                                actionButtons = `
                                    <button class="btn-primary" onclick="window.open('${mapsUrl}', '_blank')">🗺️ Google 地圖</button>
                                    <button class="btn-nav" onclick="toggleStatus('${item.id}', false)">↩️ 移回想去</button>
                                    <button class="btn-danger" onclick="deletePlace('${item.id}')">🗑️ 刪除</button>
                                `;
                            }

                            card.innerHTML = `
                                <div class="place-title">${item.name}</div>
                                <div class="place-memo">📝 備註：${item.memo || '無'}</div>
                                <div class="card-actions">
                                    ${actionButtons}
                                </div>
                            `;
                            container.appendChild(card);
                        });
                    }
                })
                .catch((error) => {
                    container.innerHTML = '<div class="empty-state">載入資料發生錯誤</div>';
                    console.error("Error getting documents: ", error);
                });
        }

        // 切換完成狀態（想去 ⇄ 已去過）
        function toggleStatus(id, newStatus) {
            db.collection("dating_places").doc(id).update({
                completed: newStatus
            })
            .then(() => {
                // 重新載入當前頁面
                if (newStatus) {
                    loadPlaces(false);
                } else {
                    loadPlaces(true);
                }
            })
            .catch((error) => {
                alert('更新狀態失敗：' + error.message);
            });
        }

        // 刪除紀錄
        function deletePlace(id) {
            if (confirm('確定要刪除這個地點嗎？')) {
                db.collection("dating_places").doc(id).delete()
                    .then(() => {
                        // 重新刷新目前顯示的頁面
                        const isComp = document.getElementById('page-3').classList.contains('active');
                        loadPlaces(isComp);
                    })
                    .catch((error) => {
                        alert('刪除失敗：' + error.message);
                    });
            }
        }
    </script>
</body>
</html>
