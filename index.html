<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的專屬約會口袋地圖</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-color: #ff6584;
            --primary-hover: #ff476f;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-color: #333333;
            --gray-text: #666666;
            --border-color: #e1e8ed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 25px;
            box-sizing: border-box;
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-bar {
            text-align: center;
            font-size: 0.85rem;
            color: var(--gray-text);
            margin-bottom: 20px;
            padding: 6px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #444;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3px, box-shadow 0.3s;
            background-color: #fafbfc;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 101, 132, 0.15);
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 101, 132, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        /* 列表檢視畫面樣式 */
        .list-view {
            display: none;
        }

        .place-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }

        .place-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .place-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .place-category {
            font-size: 0.75rem;
            background: #ffe6eb;
            color: var(--primary-color);
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .place-note {
            font-size: 0.9rem;
            color: var(--gray-text);
            margin-bottom: 10px;
            word-break: break-all;
        }

        .place-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-map {
            background-color: #4285F4;
            color: white;
        }

        .btn-done {
            background-color: #28a745;
            color: white;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 填寫表單畫面 -->
        <div id="form-view">
            <h2>📍 想一起去的地方(吃美食)</h2>
            <div id="db-status" class="status-bar">⏳ 正在連線雲端資料庫...</div>

            <div class="form-group">
                <label for="placeName">名稱：</label>
                <input type="text" id="placeName" placeholder="例如：馬岡豆花">
            </div>

            <div class="form-group">
                <label for="placeCategory">分類：</label>
                <select id="placeCategory">
                    <option value="主食">主食</option>
                    <option value="甜點/飲料">甜點/飲料</option>
                    <option value="散步約會">散步約會</option>
                    <option value="旅遊景點">旅遊景點</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="placeNote">備註（建議包含地區，例如：南屯區、西區）：</label>
                <input type="text" id="placeNote" placeholder="例如：南屯區、必吃花生豆花">
            </div>

            <button class="btn btn-primary" onclick="addPlace()">✨ 新增記錄到雲端</button>
            <button class="btn btn-secondary" onclick="switchView('wishlist')">📌 查看我們的口袋名單 (想去)</button>
            <button class="btn btn-success" onclick="switchView('completed')">🏆 查看已去過 / 已完成清單</button>
        </div>

        <!-- 列表檢視畫面 -->
        <div id="list-view" class="list-view">
            <h2 id="list-title">📌 口袋名單</h2>
            <div id="places-container">
                <!-- 動態生成的清單會在這裡 -->
            </div>
            <div class="back-link">
                <a href="#" onclick="switchView('form')">⬅️ 返回新增頁面</a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🛠️ 請填入你從 Firebase 複製的設定資訊
        // ==========================================
        const firebaseConfig = {
            apiKey: "請替換成你的apiKey",
            authDomain: "請替換成你的authDomain",
            projectId: "請替換成你的projectId",
            storageBucket: "請替換成你的storageBucket",
            messagingSenderId: "請替換成你的messagingSenderId",
            appId: "請替換成你的appId"
        };

        // 初始化 Firebase
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            document.getElementById('db-status').innerText = '🟢 已成功連線至雲端資料庫 (雙向同步中)';
            document.getElementById('db-status').style.color = '#28a745';
        } catch (error) {
            console.error("Firebase 初始化失敗:", error);
            document.getElementById('db-status').innerText = '🔴 雲端連線失敗，請檢查設定參數';
            document.getElementById('db-status').style.color = '#dc3545';
        }

        let currentMode = 'wishlist'; // 'wishlist' 或 'completed'

        // 切換畫面
        function switchView(mode) {
            const formView = document.getElementById('form-view');
            const listView = document.getElementById('list-view');
            
            if (mode === 'form') {
                formView.style.display = 'block';
                listView.style.display = 'none';
            } else {
                currentMode = mode;
                formView.style.display = 'none';
                listView.style.display = 'block';
                document.getElementById('list-title').innerText = (mode === 'wishlist') ? '📌 我們的口袋名單 (想去)' : '🏆 已去過 / 已完成清單';
                loadPlaces();
            }
        }

        // 新增地點到 Firestore
        function addPlace() {
            if (!db) {
                alert('資料庫尚未連線成功，請先檢查設定！');
                return;
            }

            const name = document.getElementById('placeName').value.trim();
            const category = document.getElementById('placeCategory').value;
            const note = document.getElementById('placeNote').value.trim();

            if (!name) {
                alert('請填寫地點名稱！');
                return;
            }

            const newPlace = {
                name: name,
                category: category,
                note: note,
                completed: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("dating_places").add(newPlace)
                .then(() => {
                    alert('成功新增到雲端！✨');
                    document.getElementById('placeName').value = '';
                    document.getElementById('placeNote').value = '';
                })
                .catch((error) => {
                    console.error("新增失敗: ", error);
                    alert('新增失敗，請稍後再試');
                });
        }

        // 從 Firestore 讀取清單
        function loadPlaces() {
            if (!db) return;

            const container = document.getElementById('places-container');
            container.innerHTML = '<p style="text-align:center; color:#666;">載入中...</p>';

            const isCompleted = (currentMode === 'completed');

            db.collection("dating_places")
                .where("completed", "==", isCompleted)
                .get()
                .then((querySnapshot) => {
                    container.innerHTML = '';
                    if (querySnapshot.empty) {
                        container.innerHTML = '<p style="text-align:center; color:#888; padding: 20px;">這裡目前沒有資料喔！趕快去新增一個吧～</p>';
                        return;
                    }

                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const docId = doc.id;
                        
                        // 自動以名稱與備註產生 Google 地圖搜尋網連結
                        const searchQuery = encodeURIComponent((data.note ? data.note + ' ' : '') + data.name);
                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${searchQuery}`;

                        const card = document.createElement('div');
                        card.className = 'place-card';
                        
                        let actionButtons = '';
                        if (!data.completed) {
                            actionButtons = `
                                <button class="btn-sm btn-done" onclick="toggleComplete('${docId}', true)">✅ 標記已去過</button>
                                <button class="btn-sm btn-delete" onclick="deletePlace('${docId}')">🗑️ 刪除</button>
                            `;
                        } else {
                            actionButtons = `
                                <button class="btn-sm btn-done" style="background-color:#6c757d;" onclick="toggleComplete('${docId}', false)">↩️ 移回想去</button>
                                <button class="btn-sm btn-delete" onclick="deletePlace('${docId}')">🗑️ 刪除</button>
                            `;
                        }

                        card.innerHTML = `
                            <div class="place-header">
                                <h3 class="place-title">${escapeHtml(data.name)}</h3>
                                <span class="place-category">${escapeHtml(data.category)}</span>
                            </div>
                            ${data.note ? `<div class="place-note">📝 備註：${escapeHtml(data.note)}</div>` : ''}
                            <div class="place-actions">
                                <a href="${mapUrl}" target="_blank" class="btn-sm btn-map">🗺️ Google 地圖</a>
                                ${actionButtons}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch((error) => {
                    console.error("讀取資料失敗: ", error);
                    container.innerHTML = '<p style="text-align:center; color:red;">讀取資料失敗，請檢查權限設定。</p>';
                });
        }

        // 切換完成狀態
        function toggleComplete(docId, status) {
            db.collection("dating_places").doc(docId).update({
                completed: status
            })
            .then(() => {
                loadPlaces();
            })
            .catch((error) => {
                console.error("更新狀態失敗: ", error);
            });
        }

        // 刪除地點
        function deletePlace(docId) {
            if (confirm('確定要刪除這個地點嗎？')) {
                db.collection("dating_places").doc(docId).delete()
                    .then(() => {
                        loadPlaces();
                    })
                    .catch((error) => {
                        console.error("刪除失敗: ", error);
                    });
            }
        }

        // 防止 XSS 攻擊的簡單跳脫函式
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
