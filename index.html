<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我的口袋地圖清單</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA 必要設定 -->
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%E6%88%91%E7%9A%84%E5%8F%A3%E8%A2%8B%E5%9C%B0%E5%9C%96%E6%B8%85%E5%96%AE%22%2C%22short_name%22%3A%22%E5%8F%A3%E8%A2%8B%E5%9C%B0%E5%9C%96%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f5f7fa%22%2C%22theme_color%22%3A%22%233b82f6%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh;
            color: #333;
        }
        .card { 
            background: #ffffff; 
            padding: 25px; 
            margin-bottom: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); 
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 { margin-top: 0; color: #1e293b; font-size: 22px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #475569; font-size: 14px; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin: 4px 0 16px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            transition: all 0.2s;
            background: #f8fafc;
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: #3b82f6; 
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin: 6px 0; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #2563eb; }
        button:active { transform: scale(0.98); }
        .secondary-btn { background: #64748b; }
        .secondary-btn:hover { background: #475569; }
        .success-btn { background: #10b981; }
        .success-btn:hover { background: #059669; }
        
        .map-btn { background: #10b981; padding: 4px 10px; font-size: 13px; width: auto; margin-left: 6px; text-decoration: none; display: inline-block; border-radius: 6px; color: white; font-weight: 500; }
        .map-btn:hover { background: #059669; }
        .done-btn { background: #0ea5e9; padding: 4px 10px; font-size: 13px; width: auto; margin-left: 6px; border-radius: 6px; color: white; cursor: pointer; border: none; font-weight: 500; }
        .done-btn:hover { background: #0284c7; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 6px; width: auto; font-weight: 500; }
        .delete-btn:hover { background: #dc2626; }

        .category-section { margin-top: 24px; background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .category-section h3 { margin: 0 0 10px 0; font-size: 17px; color: #334155; border-left: 4px solid #3b82f6; padding-left: 8px; }
        .sub-region-title { font-size: 14px; color: #2563eb; margin: 12px 0 6px 0; font-weight: bold; background: #e0f2fe; display: inline-block; padding: 2px 8px; border-radius: 4px; }
        ul { padding-left: 20px; margin: 5px 0; }
        li { margin-bottom: 10px; line-height: 1.6; color: #334155; }
        .hidden { display: none; }
    </style>
</head>
<body>

<!-- 第一頁：新增表單 -->
<div id="page-home" class="card">
    <h2>📍 新增想去的地點</h2>
    <form id="placeForm">
        <label>名稱：</label>
        <input type="text" id="name" required placeholder="例如：馬岡豆花">
        
        <label>分類：</label>
        <select id="category">
            <option value="main">主食</option>
            <option value="snack">點心</option>
            <option value="drink">飲料</option>
            <option value="scenery">風景</option>
        </select>
        
        <label>備註（建議包含地區，例如：南屯區、西區）：</label>
        <input type="text" id="note" placeholder="例如：南屯區、必吃花生豆花">
        
        <button type="submit">✨ 新增記錄</button>
    </form>
    <button class="secondary-btn" onclick="switchPage('list')">📌 查看我的口袋名單（想去）</button>
    <button class="success-btn" onclick="switchPage('done')">🏆 查看已去過 / 已完成清單</button>
</div>

<!-- 第二頁：想去清單列表 -->
<div id="page-list" class="card hidden">
    <h2>📌 我的口袋名單（想去）</h2>
    
    <div class="category-section"><h3>主食</h3><div id="list-main"></div></div>
    <div class="category-section"><h3>點心</h3><div id="list-snack"></div></div>
    <div class="category-section"><h3>飲料</h3><div id="list-drink"></div></div>
    <div class="category-section"><h3>風景</h3><div id="list-scenery"></div></div>

    <button class="secondary-btn" style="margin-top: 20px;" onclick="switchPage('home')">⬅ 返回新增頁面</button>
</div>

<!-- 第三頁：已完成（已去過）清單 -->
<div id="page-done" class="card hidden">
    <h2>🏆 已去過的地點</h2>
    
    <div class="category-section"><h3>主食</h3><div id="list-done-main"></div></div>
    <div class="category-section"><h3>點心</h3><div id="list-done-snack"></div></div>
    <div class="category-section"><h3>飲料</h3><div id="list-done-drink"></div></div>
    <div class="category-section"><h3>風景</h3><div id="list-done-scenery"></div></div>

    <button class="secondary-btn" style="margin-top: 20px;" onclick="switchPage('home')">⬅ 返回新增頁面</button>
    <button class="secondary-btn" onclick="switchPage('list')">⬅ 返回想去清單</button>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('data:text/javascript,').catch(() => {});
        });
    }

    const categories = { 'main': '主食', 'snack': '點心', 'drink': '飲料', 'scenery': '風景' };
    
    function getPlaces() {
        let places = JSON.parse(localStorage.getItem('my_places') || '[]');
        let updated = false;
        places.forEach((p, idx) => {
            if (!p.id) {
                p.id = 'p_' + Date.now() + '_' + idx;
                updated = true;
            }
        });
        if (updated) {
            localStorage.setItem('my_places', JSON.stringify(places));
        }
        return places;
    }

    function savePlaces(places) {
        localStorage.setItem('my_places', JSON.stringify(places));
        render();
    }

    window.switchPage = function(page) {
        document.getElementById('page-home').classList.add('hidden');
        document.getElementById('page-list').classList.add('hidden');
        document.getElementById('page-done').classList.add('hidden');

        if (page === 'home') {
            document.getElementById('page-home').classList.remove('hidden');
        } else if (page === 'list') {
            document.getElementById('page-list').classList.remove('hidden');
            render();
        } else if (page === 'done') {
            document.getElementById('page-done').classList.remove('hidden');
            render();
        }
    }

    function extractRegion(note) {
        if (!note) return '未分類地區';
        const match = note.match(/[\u4e05-\u9fa5]+[區市鎮鄉]/);
        if (match) {
            return match[0];
        }
        return '其他地區';
    }

    function renderCategoryContent(containerId, filteredPlaces, isDonePage) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        if (filteredPlaces.length === 0) {
            container.innerHTML = '<ul style="padding-left: 20px; margin:0;"><li style="color: #94a3b8; list-style: none;">暫無記錄</li></ul>';
            return;
        }

        let regionGroups = {};
        filteredPlaces.forEach(p => {
            let region = extractRegion(p.note);
            if (!regionGroups[region]) {
                regionGroups[region] = [];
            }
            regionGroups[region].push(p);
        });

        for (let region in regionGroups) {
            let regionDiv = document.createElement('div');
            regionDiv.innerHTML = `<div class="sub-region-title">📍 ${region}</div>`;
            
            let ul = document.createElement('ul');
            regionGroups[region].forEach(p => {
                const li = document.createElement('li');
                
                let mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
                let mapButtonHtml = `<a href="${mapLink}" target="_blank" class="map-btn">🗺️ 地圖</a>`;
                
                let actionBtnHtml = isDonePage 
                    ? `<button class="delete-btn" onclick="deletePlace('${p.id}')">刪除</button>`
                    : `<button class="done-btn" onclick="markAsDone('${p.id}')">✔️ 完成</button>
                       <button class="delete-btn" onclick="deletePlace('${p.id}')">刪除</button>`;

                li.innerHTML = `<strong>${p.name}</strong> ${mapButtonHtml} <span style="color:#64748b;">- ${p.note || ''}</span> ${actionBtnHtml}`;
                ul.appendChild(li);
            });
            regionDiv.appendChild(ul);
            container.appendChild(regionDiv);
        }
    }

    function render() {
        const places = getPlaces();
        
        for (let key in categories) {
            const filtered = places.filter(p => p.category === key && p.status !== 'done');
            renderCategoryContent(`list-${key}`, filtered, false);
        }

        for (let key in categories) {
            const doneFiltered = places.filter(p => p.category === key && p.status === 'done');
            renderCategoryContent(`list-done-${key}`, doneFiltered, true);
        }
    }

    window.markAsDone = function(id) {
        let places = getPlaces();
        let place = places.find(p => p.id === id);
        if (place) {
            place.status = 'done';
            savePlaces(places);
        }
    }

    window.deletePlace = function(id) {
        let places = getPlaces();
        let newPlaces = places.filter(p => p.id !== id);
        savePlaces(newPlaces);
    }

    document.getElementById('placeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const category = document.getElementById('category').value;
        const note = document.getElementById('note').value;

        let places = getPlaces();
        const newPlace = {
            id: 'p_' + Date.now() + Math.random().toString(36).substr(2, 5),
            name,
            category,
            note,
            status: 'want'
        };

        places.push(newPlace);
        savePlaces(places);

        document.getElementById('placeForm').reset();
        alert('✨ 新增成功！');
    });
</script>

</body>
</html>
